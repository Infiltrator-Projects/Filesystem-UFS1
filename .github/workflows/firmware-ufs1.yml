# SPDX-License-Identifier: GPL-3.0-or-later
name: Qualify UFS1 native freestanding Common V2 ELF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ufs1-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils cmake git libssl-dev
      - name: Qualify native UFS1 engine as no-import Common V2 firmware ELF
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target ufs1-firmware-elf --parallel 2
          test -s build/firmware/UFS1.so
          ! readelf -dW build/firmware/UFS1.so | grep '(NEEDED)'
          nm -D --defined-only build/firmware/UFS1.so | grep -F infiltrator_filesystem_api_v2
          ! nm -u build/firmware/UFS1.so | grep .
      - name: Validate using real production BOOT 0.1.77
        run: |
          set -euo pipefail
          boot=infiltrator-boot_0.1.77_amd64.deb
          curl -fsSL --retry 3 \
            "https://github.com/Infiltrator-Projects/Boot/releases/download/v0.1.77/$boot" \
            -o "$RUNNER_TEMP/$boot"
          printf '%s  %s\n' \
            4b2fa8eaa116b7e719329c5bbaa39ee3a093fbe1c1eac0c57440d0f82217d8a5 \
            "$RUNNER_TEMP/$boot" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$boot" "$RUNNER_TEMP/boot"
          "$RUNNER_TEMP/boot/usr/lib/infiltrator-boot/validate-module" build/firmware/UFS1.so
          validator="$RUNNER_TEMP/boot/usr/lib/infiltrator-boot/validate-module"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          DESTDIR="$RUNNER_TEMP/stage" cmake --install build
          module="$RUNNER_TEMP/stage/System/Filesystems/UFS1.so"
          readelf -SW "$module" | grep -F '.infiltrator_boot'
          "$validator" "$module"
          cmp build/UFS1.so "$module"
          echo UFS1_FREESTANDING_AND_HOSTED_CARRIER_VALIDATOR_PASS
