name: UFS1 independent shared object
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ufs1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev
      - name: Build and test UFS1.so
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          test -f build/UFS1.so
          nm -D build/UFS1.so | grep -F 'infiltrator_filesystem_api_v2'
          ! nm -D build/UFS1.so | grep -E 'infiltrator_filesystem_.*_v1'
          readelf -p .ifsmeta build/UFS1.so | grep -F 'IFS-MODULE:ufs1:common2'
      - name: Verify direct install has exactly UFS1.so and its current manual
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -s "$stage/System/Filesystems/UFS1.so"
          test -s "$stage/System/Resources/Documentation/Filesystem-UFS1.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-UFS1.pdf")" = '%PDF-'
          cmp build/Filesystem-UFS1.pdf "$stage/System/Resources/Documentation/Filesystem-UFS1.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: UFS1-so
          path: build/UFS1.so
