name: Qualify and release UFS1 independent native installer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-ufs1-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned-source build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev python3
      - name: Build standalone portable Debian and exact-source native RUN
        run: |
          set -euo pipefail
          python3 -m py_compile standalone/build.py standalone/release.py
          python3 standalone/release.py release
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" -eq 1
      - name: Build exact embedded source CPU-native and verify the two-file payload
        run: |
          set -euo pipefail
          bash dist/*.run --profile aggressive --build-only --output "$RUNNER_TEMP/native"
          package="$(find "$RUNNER_TEMP/native" -type f -name '*.deb' -print -quit)"
          test -s "$package"
          test "$(dpkg-deb -f "$package" X-Infiltrator-Native-Profile)" = aggressive
          test "$(dpkg-deb -f "$package" X-Infiltrator-PGO)" = trained-two-pass
          test "$(dpkg-deb -f "$package" X-Infiltrator-Source-Revision)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/payload"
          dpkg-deb -x "$package" "$RUNNER_TEMP/payload"
          test "$(find "$RUNNER_TEMP/payload" -type f | wc -l)" -eq 2
          test -s "$RUNNER_TEMP/payload/System/Filesystems/UFS1.so"
          test -s "$RUNNER_TEMP/payload/System/Resources/Documentation/Filesystem-UFS1/UFS1.pdf"
          test "$(head -c 5 "$RUNNER_TEMP/payload/System/Resources/Documentation/Filesystem-UFS1/UFS1.pdf")" = '%PDF-'
          nm -D "$RUNNER_TEMP/payload/System/Filesystems/UFS1.so" | grep -F infiltrator_filesystem_ufs_v1
      - uses: actions/upload-artifact@v4
        with:
          name: ufs1-native-installers
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ufs1-native-installers
          path: dist
      - name: Publish only verified immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(tr -d '\r\n' < VERSION)"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing immutable release retained"
            exit 0
          fi
          gh release create "$tag" dist/*.deb dist/*.run --target "$GITHUB_SHA" \
            --title "UFS1 experimental module $tag" \
            --notes "Independent UFS1.so, one illustrated PDF, and pinned-source CPU-native RUN. Built with the exact embedded Libraries/Common source. Real-media mutation, defrag and recovery qualification is pending; not certified production-safe."
